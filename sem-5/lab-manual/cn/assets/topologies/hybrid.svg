<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" font-family="sans-serif">
  <rect width="500" height="240" fill="#ffffff" rx="8"/>
  <!-- Backbone Bus -->
  <line x1="50" y1="60" x2="450" y2="60" stroke="#1e293b" stroke-width="5"/>
  <text x="250" y="45" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">Bus Backbone Connection</text>
  <!-- Star Cluster 1 -->
  <line x1="120" y1="60" x2="120" y2="120" stroke="#64748b" stroke-width="2"/>
  <rect x="90" y="120" width="60" height="30" rx="5" fill="#1e3a8a"/><text x="120" y="140" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Hub 1</text>
  <circle cx="60" cy="190" r="16" fill="#0284c7"/><line x1="100" y1="150" x2="60" y2="190" stroke="#94a3b8" stroke-width="1.5"/><text x="60" y="194" fill="#fff" font-size="9" text-anchor="middle">PC 1</text>
  <circle cx="120" cy="190" r="16" fill="#0284c7"/><line x1="120" y1="150" x2="120" y2="190" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="194" fill="#fff" font-size="9" text-anchor="middle">PC 2</text>
  <circle cx="180" cy="190" r="16" fill="#0284c7"/><line x1="140" y1="150" x2="180" y2="190" stroke="#94a3b8" stroke-width="1.5"/><text x="180" y="194" fill="#fff" font-size="9" text-anchor="middle">PC 3</text>
  <!-- Ring Cluster 2 -->
  <line x1="360" y1="60" x2="360" y2="110" stroke="#64748b" stroke-width="2"/>
  <circle cx="360" cy="150" r="35" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="360" cy="115" r="14" fill="#059669"/><text x="360" y="119" fill="#fff" font-size="8" text-anchor="middle">R1</text>
  <circle cx="395" cy="150" r="14" fill="#059669"/><text x="395" y="154" fill="#fff" font-size="8" text-anchor="middle">R2</text>
  <circle cx="360" cy="185" r="14" fill="#059669"/><text x="360" y="189" fill="#fff" font-size="8" text-anchor="middle">R3</text>
  <circle cx="325" cy="150" r="14" fill="#059669"/><text x="325" y="154" fill="#fff" font-size="8" text-anchor="middle">R4</text>
  <text x="360" y="225" fill="#059669" font-size="11" font-weight="bold" text-anchor="middle">Ring Subnet</text>
</svg>