<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" font-family="sans-serif">
  <rect width="500" height="240" fill="#ffffff" rx="8"/>
  <!-- Backbone Bus Line -->
  <line x1="60" y1="120" x2="440" y2="120" stroke="#1e293b" stroke-width="6"/>
  <!-- Terminators -->
  <rect x="45" y="105" width="15" height="30" rx="3" fill="#ef4444"/><text x="52" y="150" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">50Ω Term</text>
  <rect x="440" y="105" width="15" height="30" rx="3" fill="#ef4444"/><text x="447" y="150" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">50Ω Term</text>
  <!-- Nodes (Drop Cables & PCs) -->
  <!-- Node 1 -->
  <line x1="120" y1="120" x2="120" y2="60" stroke="#0284c7" stroke-width="3"/>
  <rect x="90" y="20" width="60" height="40" rx="6" fill="#0284c7"/><text x="120" y="45" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Node A</text>
  <!-- Node 2 -->
  <line x1="220" y1="120" x2="220" y2="180" stroke="#0284c7" stroke-width="3"/>
  <rect x="190" y="180" width="60" height="40" rx="6" fill="#0284c7"/><text x="220" y="205" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Node B</text>
  <!-- Node 3 -->
  <line x1="300" y1="120" x2="300" y2="60" stroke="#0284c7" stroke-width="3"/>
  <rect x="270" y="20" width="60" height="40" rx="6" fill="#0284c7"/><text x="300" y="45" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Node C</text>
  <!-- Node 4 -->
  <line x1="390" y1="120" x2="390" y2="180" stroke="#0284c7" stroke-width="3"/>
  <rect x="360" y="180" width="60" height="40" rx="6" fill="#0284c7"/><text x="390" y="205" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Node D</text>
</svg>