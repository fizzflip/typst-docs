<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" font-family="sans-serif">
  <rect width="460" height="260" fill="#ffffff" rx="8"/>
  <!-- Root Switch -->
  <rect x="190" y="20" width="80" height="40" rx="6" fill="#1e3a8a"/><text x="230" y="45" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Root Core</text>
  <!-- Branches to Distribution Switches -->
  <line x1="210" y1="60" x2="110" y2="110" stroke="#64748b" stroke-width="2"/>
  <line x1="250" y1="60" x2="350" y2="110" stroke="#64748b" stroke-width="2"/>
  <rect x="70" y="110" width="80" height="35" rx="6" fill="#0284c7"/><text x="110" y="132" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Dist Switch 1</text>
  <rect x="310" y="110" width="80" height="35" rx="6" fill="#0284c7"/><text x="350" y="132" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Dist Switch 2</text>
  <!-- End Hosts -->
  <line x1="90" y1="145" x2="50" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="50" cy="200" r="18" fill="#10b981"/><text x="50" y="204" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">PC 1</text>
  <line x1="130" y1="145" x2="150" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="150" cy="200" r="18" fill="#10b981"/><text x="150" y="204" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">PC 2</text>
  <line x1="330" y1="145" x2="300" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="300" cy="200" r="18" fill="#10b981"/><text x="300" y="204" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">PC 3</text>
  <line x1="370" y1="145" x2="410" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="410" cy="200" r="18" fill="#10b981"/><text x="410" y="204" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">PC 4</text>
</svg>