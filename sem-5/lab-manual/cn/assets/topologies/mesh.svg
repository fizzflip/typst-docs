<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" font-family="sans-serif">
  <rect width="380" height="320" fill="#ffffff" rx="8"/>
  <!-- 5 Nodes coordinates -->
  <!-- A: (190, 40), B: (320, 130), C: (270, 260), D: (110, 260), E: (60, 130) -->
  <!-- 10 Full Mesh Interconnections (5*4/2 = 10) -->
  <line x1="190" y1="40" x2="320" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="190" y1="40" x2="270" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="190" y1="40" x2="110" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="190" y1="40" x2="60" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="130" x2="270" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="130" x2="110" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="130" x2="60" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="260" x2="110" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="260" x2="60" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="260" x2="60" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Nodes -->
  <circle cx="190" cy="40" r="22" fill="#7c3aed"/><text x="190" y="45" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Node A</text>
  <circle cx="320" cy="130" r="22" fill="#7c3aed"/><text x="320" y="135" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Node B</text>
  <circle cx="270" cy="260" r="22" fill="#7c3aed"/><text x="270" y="265" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Node C</text>
  <circle cx="110" cy="260" r="22" fill="#7c3aed"/><text x="110" y="265" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Node D</text>
  <circle cx="60" cy="130" r="22" fill="#7c3aed"/><text x="60" y="135" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Node E</text>
</svg>