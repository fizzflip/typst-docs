    <rect width="390" height="45" rx="10" fill="#1e3a8a"/>
    <text x="195" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">EIA/TIA T-568A STANDARD</text>

