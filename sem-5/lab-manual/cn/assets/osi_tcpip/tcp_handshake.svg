<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="800" height="380" fill="#ffffff" rx="10"/>

  <!-- Client & Server Headers -->
  <g transform="translate(100, 30)">
    <rect width="180" height="50" rx="8" fill="#1e3a8a"/>
    <text x="90" y="26" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">TCP CLIENT</text>
    <text x="90" y="42" fill="#93c5fd" font-size="11" text-anchor="middle">(Active Open)</text>
    <line x1="90" y1="55" x2="90" y2="330" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <g transform="translate(520, 30)">
    <rect width="180" height="50" rx="8" fill="#065f46"/>
    <text x="90" y="26" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">TCP SERVER</text>
    <text x="90" y="42" fill="#a7f3d0" font-size="11" text-anchor="middle">(Passive Open / LISTEN)</text>
    <line x1="90" y1="55" x2="90" y2="330" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <!-- Step 1: SYN -->
  <g transform="translate(190, 110)">
    <line x1="0" y1="0" x2="410" y2="40" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="110" y="-10" width="200" height="32" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="210" y="11" fill="#1e40af" font-size="12" font-weight="bold" text-anchor="middle">1. SYN [Seq = x]</text>
  </g>
  <text x="90" y="130" fill="#64748b" font-size="11" text-anchor="end">State: SYN_SENT</text>
  <text x="710" y="165" fill="#64748b" font-size="11">State: SYN_RCVD</text>

  <!-- Step 2: SYN-ACK -->
  <g transform="translate(190, 190)">
    <line x1="420" y1="0" x2="10" y2="40" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <rect x="100" y="-10" width="220" height="32" rx="5" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="210" y="11" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">2. SYN-ACK [Seq = y, Ack = x + 1]</text>
  </g>
  <text x="90" y="245" fill="#16a34a" font-size="11" font-weight="bold" text-anchor="end">ESTABLISHED</text>

  <!-- Step 3: ACK -->
  <g transform="translate(190, 270)">
    <line x1="0" y1="0" x2="410" y2="35" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <rect x="110" y="-10" width="200" height="32" rx="5" fill="#faf5ff" stroke="#a855f7"/>
    <text x="210" y="11" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">3. ACK [Seq = x + 1, Ack = y + 1]</text>
  </g>
  <text x="710" y="315" fill="#16a34a" font-size="11" font-weight="bold">ESTABLISHED</text>
</svg>