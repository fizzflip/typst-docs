<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" font-family="sans-serif">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="#ffffff" rx="12"/>

  <!-- Left: OSI 7 Layer Model -->
  <g transform="translate(30, 20)">
    <rect width="400" height="480" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="400" height="45" rx="10" fill="#1e3a8a"/>
    <text x="200" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">OSI 7-LAYER REFERENCE MODEL</text>

    <!-- Layer 7 -->
    <g transform="translate(20, 60)">
      <rect width="360" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#3b82f6"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 7</text>
      <text x="85" y="24" fill="#1e3a8a" font-size="14" font-weight="bold">Application</text>
      <text x="85" y="40" fill="#64748b" font-size="11">HTTP, DNS, SMTP, FTP, Telnet (PDU: Data)</text>
    </g>
    <!-- Layer 6 -->
    <g transform="translate(20, 116)">
      <rect width="360" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#2563eb"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 6</text>
      <text x="85" y="24" fill="#1e3a8a" font-size="14" font-weight="bold">Presentation</text>
      <text x="85" y="40" fill="#64748b" font-size="11">SSL/TLS, JPEG, ASCII, Encryption (PDU: Data)</text>
    </g>
    <!-- Layer 5 -->
    <g transform="translate(20, 172)">
      <rect width="360" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#1d4ed8"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 5</text>
      <text x="85" y="24" fill="#1e3a8a" font-size="14" font-weight="bold">Session</text>
      <text x="85" y="40" fill="#64748b" font-size="11">RPC, NetBIOS, Sockets, Session Management</text>
    </g>
    <!-- Layer 4 -->
    <g transform="translate(20, 228)">
      <rect width="360" height="48" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#16a34a"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 4</text>
      <text x="85" y="24" fill="#14532d" font-size="14" font-weight="bold">Transport</text>
      <text x="85" y="40" fill="#64748b" font-size="11">TCP, UDP, SCTP (PDU: Segment / Datagram)</text>
    </g>
    <!-- Layer 3 -->
    <g transform="translate(20, 284)">
      <rect width="360" height="48" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#ca8a04"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 3</text>
      <text x="85" y="24" fill="#713f12" font-size="14" font-weight="bold">Network</text>
      <text x="85" y="40" fill="#64748b" font-size="11">IPv4, IPv6, ICMP, ARP, OSPF, BGP (PDU: Packet)</text>
    </g>
    <!-- Layer 2 -->
    <g transform="translate(20, 340)">
      <rect width="360" height="48" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#9333ea"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 2</text>
      <text x="85" y="24" fill="#581c87" font-size="14" font-weight="bold">Data Link</text>
      <text x="85" y="40" fill="#64748b" font-size="11">Ethernet (802.3), Wi-Fi (802.11), MAC (PDU: Frame)</text>
    </g>
    <!-- Layer 1 -->
    <g transform="translate(20, 396)">
      <rect width="360" height="48" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#e11d48"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 1</text>
      <text x="85" y="24" fill="#881337" font-size="14" font-weight="bold">Physical</text>
      <text x="85" y="40" fill="#64748b" font-size="11">Cables (Cat5e/6, Fiber), Hubs, Repeaters (PDU: Bits)</text>
    </g>
  </g>

  <!-- Right: TCP/IP 4-Layer Model -->
  <g transform="translate(470, 20)">
    <rect width="400" height="480" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="400" height="45" rx="10" fill="#065f46"/>
    <text x="200" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">TCP/IP 4-LAYER INTERNET ARCHITECTURE</text>

    <!-- Layer 4: Application -->
    <g transform="translate(20, 60)">
      <rect width="360" height="160" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="70" height="160" rx="6" fill="#2563eb"/>
      <text x="35" y="85" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 35 85)">Layer 4</text>
      <text x="85" y="35" fill="#1e3a8a" font-size="16" font-weight="bold">Application Layer</text>
      <text x="85" y="60" fill="#475569" font-size="12">Combines OSI Application, Presentation & Session</text>
      <text x="85" y="85" fill="#0f172a" font-size="12" font-weight="600">Protocols:</text>
      <text x="85" y="105" fill="#2563eb" font-size="12">HTTP, HTTPS, DNS, DHCP, SSH, SMTP, FTP</text>
      <text x="85" y="130" fill="#64748b" font-size="11">Data Representation, Encryption, User Interaction</text>
    </g>

    <!-- Layer 3: Transport -->
    <g transform="translate(20, 228)">
      <rect width="360" height="48" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#16a34a"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 3</text>
      <text x="85" y="24" fill="#14532d" font-size="14" font-weight="bold">Transport Layer (Host-to-Host)</text>
      <text x="85" y="40" fill="#64748b" font-size="11">TCP (Reliable, Handshake) / UDP (Fast, Datagram)</text>
    </g>

    <!-- Layer 2: Internet -->
    <g transform="translate(20, 284)">
      <rect width="360" height="48" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
      <rect width="70" height="48" rx="6" fill="#ca8a04"/>
      <text x="35" y="28" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Layer 2</text>
      <text x="85" y="24" fill="#713f12" font-size="14" font-weight="bold">Internet Layer</text>
      <text x="85" y="40" fill="#64748b" font-size="11">IPv4, IPv6, ICMP, ARP (Packet Routing & Addressing)</text>
    </g>

    <!-- Layer 1: Network Access -->
    <g transform="translate(20, 340)">
      <rect width="360" height="104" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="70" height="104" rx="6" fill="#9333ea"/>
      <text x="35" y="55" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 35 55)">Layer 1</text>
      <text x="85" y="30" fill="#581c87" font-size="15" font-weight="bold">Network Access Layer (Link)</text>
      <text x="85" y="52" fill="#475569" font-size="12">Combines OSI Data Link & Physical Layers</text>
      <text x="85" y="74" fill="#0f172a" font-size="12" font-weight="600">Hardware & Framing:</text>
      <text x="85" y="94" fill="#7c3aed" font-size="12">Ethernet 802.3, Wi-Fi 802.11, MAC, Twisted Pair/Fiber</text>
    </g>
  </g>
</svg>