<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="14" fill="url(#bgGrad2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="460" y="34" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">IEEE STD 830-1998 SRS ARCHITECTURAL BREAKDOWN</text>
  <text x="460" y="54" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" fill="#475569">System Requirements Taxonomy for SwiftRide Enterprise Ride-Sharing Platform</text>

  <!-- Root: SRS Specification -->
  <g transform="translate(320, 75)" filter="url(#shadow2)">
    <rect width="280" height="52" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="140" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">SwiftRide SRS Specification</text>
    <text x="140" y="42" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#334155">IEEE Std 830 Core Requirement Model</text>
  </g>

  <!-- Connecting Lines from Root -->
  <path d="M 460 127 L 460 155 M 150 155 L 770 155" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 150 155 L 150 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 460 155 L 460 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 770 155 L 770 180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Section 1: Functional Requirements -->
  <g transform="translate(30, 180)" filter="url(#shadow2)">
    <rect width="240" height="42" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#047857">1. Functional Requirements</text>
    
    <!-- Sub-boxes -->
    <g transform="translate(10, 52)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">FR-01: User Auth &amp; Profile Mgmt</text>
    </g>
    <g transform="translate(10, 92)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">FR-02: Vehicle Search &amp; Filter</text>
    </g>
    <g transform="translate(10, 132)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">FR-03: RideSession &amp; Multi-item Booking</text>
    </g>
    <g transform="translate(10, 172)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">FR-04: Payment &amp; Ride Pipeline</text>
    </g>
    <g transform="translate(10, 212)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">FR-05: Admin Inventory Control</text>
    </g>
  </g>

  <!-- Section 2: Non-Functional Requirements -->
  <g transform="translate(340, 180)" filter="url(#shadow2)">
    <rect width="240" height="42" rx="6" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#d97706">2. Non-Functional Req.</text>
    
    <!-- Sub-boxes -->
    <g transform="translate(10, 52)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">NFR-01: Latency &lt; 200ms at Peak</text>
    </g>
    <g transform="translate(10, 92)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">NFR-02: Security (OAuth2/AES-256)</text>
    </g>
    <g transform="translate(10, 132)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">NFR-03: 99.95% High Availability</text>
    </g>
    <g transform="translate(10, 172)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">NFR-04: Responsive WCAG 2.1 UI</text>
    </g>
    <g transform="translate(10, 212)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">NFR-05: Horizontal Scale 50k Concur.</text>
    </g>
  </g>

  <!-- Section 3: Interface Requirements -->
  <g transform="translate(650, 180)" filter="url(#shadow2)">
    <rect width="240" height="42" rx="6" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">3. System &amp; External Interfaces</text>
    
    <!-- Sub-boxes -->
    <g transform="translate(10, 52)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">IF-01: REST &amp; GraphQL Client APIs</text>
    </g>
    <g transform="translate(10, 92)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">IF-02: Payment Gateway (Stripe/UPI)</text>
    </g>
    <g transform="translate(10, 132)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">IF-03: Logistics Courier API Webhook</text>
    </g>
    <g transform="translate(10, 172)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">IF-04: SMTP &amp; Push Notification</text>
    </g>
    <g transform="translate(10, 212)">
      <rect width="220" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" fill="#0f172a">IF-05: Relational DB / Cache Layer</text>
    </g>
  </g>

</svg>
