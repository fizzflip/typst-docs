<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="480" rx="14" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="460" y="36" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" letter-spacing="1">SOFTWARE DEVELOPMENT LIFE CYCLE (SDLC) WORKFLOW &amp; PHASES</text>
  <text x="460" y="56" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" fill="#475569">Systematic Engineering Process, Key Activities, and Output Deliverables</text>

  <!-- Central Hub / Iterative Feedback Ring -->
  <ellipse cx="460" cy="250" rx="125" ry="110" fill="#f8fafc" stroke="#0284c7" stroke-dasharray="5,5" stroke-width="1.8" opacity="0.6"/>
  <circle cx="460" cy="250" r="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#dropShadow)"/>
  <text x="460" y="240" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">CONTINUOUS</text>
  <text x="460" y="255" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">QUALITY &amp;</text>
  <text x="460" y="270" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10" fill="#9333ea">GOVERNANCE</text>

  <!-- Phase 1: Planning & Feasibility -->
  <g transform="translate(350, 80)" filter="url(#dropShadow)">
    <rect width="220" height="60" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="20" cy="30" r="12" fill="#0369a1"/>
    <text x="20" y="35" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">1</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#0284c7">Planning &amp; Feasibility</text>
    <text x="42" y="44" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">Scope, Cost, Risk, Resource Plan</text>
  </g>

  <!-- Phase 2: Requirements Analysis -->
  <g transform="translate(640, 115)" filter="url(#dropShadow)">
    <rect width="230" height="64" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="20" cy="32" r="12" fill="#4f46e5"/>
    <text x="20" y="37" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">2</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#4f46e5">Requirement Analysis</text>
    <text x="42" y="42" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">IEEE 830 SRS, Stakeholder Elicitation</text>
    <text x="42" y="55" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#4338ca">Deliverable: SRS Document</text>
  </g>

  <!-- Phase 3: System Design (HLD/LLD) -->
  <g transform="translate(670, 240)" filter="url(#dropShadow)">
    <rect width="220" height="64" rx="8" fill="#f8fafc" stroke="#9333ea" stroke-width="1.5"/>
    <circle cx="20" cy="32" r="12" fill="#9333ea"/>
    <text x="20" y="37" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">3</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#7e22ce">System &amp; Architecture Design</text>
    <text x="42" y="42" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">UML Modeling, DB Schema, API Specs</text>
    <text x="42" y="55" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#d8b4fe">Deliverable: HLD &amp; LLD Specs</text>
  </g>

  <!-- Phase 4: Implementation / Coding -->
  <g transform="translate(540, 375)" filter="url(#dropShadow)">
    <rect width="220" height="64" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <circle cx="20" cy="32" r="12" fill="#059669"/>
    <text x="20" y="37" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">4</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#047857">Coding &amp; Implementation</text>
    <text x="42" y="42" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">Source Code, Unit Testing, VCS</text>
    <text x="42" y="55" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">Deliverable: Verified Code Base</text>
  </g>

  <!-- Phase 5: Testing & QA -->
  <g transform="translate(180, 375)" filter="url(#dropShadow)">
    <rect width="230" height="64" rx="8" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="20" cy="32" r="12" fill="#d97706"/>
    <text x="20" y="37" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">5</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#d97706">Integration &amp; System QA</text>
    <text x="42" y="42" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">Black/White Box, Cyclomatic Coverage</text>
    <text x="42" y="55" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#fde68a">Deliverable: Test Reports &amp; Metrics</text>
  </g>

  <!-- Phase 6: Deployment -->
  <g transform="translate(30, 240)" filter="url(#dropShadow)">
    <rect width="220" height="64" rx="8" fill="#f8fafc" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="20" cy="32" r="12" fill="#db2777"/>
    <text x="20" y="37" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">6</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#db2777">Deployment &amp; Release</text>
    <text x="42" y="42" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">CI/CD Pipeline, Staging, Vehicleion</text>
    <text x="42" y="55" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#fbcfe8">Deliverable: Live Vehicle Release</text>
  </g>

  <!-- Phase 7: Maintenance & Support -->
  <g transform="translate(60, 115)" filter="url(#dropShadow)">
    <rect width="220" height="64" rx="8" fill="#f8fafc" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="20" cy="32" r="12" fill="#0891b2"/>
    <text x="20" y="37" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">7</text>
    <text x="42" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="11.5" font-weight="bold" fill="#22d3ee">Operations &amp; Maintenance</text>
    <text x="42" y="42" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">Corrective, Adaptive &amp; Perfective</text>
    <text x="42" y="55" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#a5f3fc">Deliverable: Patches &amp; Upgrades</text>
  </g>

  <!-- Connecting Curved Arrows -->
  <path d="M 570 110 C 605 110, 615 130, 640 140" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <path d="M 750 180 C 765 200, 770 215, 770 240" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 750 305 C 730 340, 700 370, 660 375" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 540 405 C 490 410, 450 410, 410 405" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 230 375 C 190 350, 160 320, 145 305" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 140 240 C 140 210, 145 195, 155 180" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 140 C 305 130, 325 115, 350 110" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
