<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow13" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
    <marker id="bug-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="bug-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="bug-arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="940" height="540" rx="14" fill="url(#bgGrad13)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="28" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">DEFECT / BUG REPORTING &amp; RESOLUTION LIFECYCLE</text>
  <text x="470" y="46" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10.5" fill="#475569">IEEE 829 Standard Defect Management Workflow: States, Decision Triage, Retest, &amp; Closure</text>

  <!-- Start Circle (Initial Defect Logging) -->
  <circle cx="60" cy="130" r="14" fill="#0284c7" stroke="#020617" stroke-width="2"/>
  <text x="60" y="160" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#475569">Discovered</text>

  <!-- State 1: NEW -->
  <g transform="translate(120, 105)" filter="url(#shadow13)">
    <rect width="120" height="50" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">1. NEW</text>
    <text x="60" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Logged by QA</text>
  </g>

  <!-- State 2: ASSIGNED -->
  <g transform="translate(290, 105)" filter="url(#shadow13)">
    <rect width="120" height="50" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#4338ca">2. ASSIGNED</text>
    <text x="60" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Triaged to Dev</text>
  </g>

  <!-- State 3: OPEN / IN PROGRESS -->
  <g transform="translate(460, 105)" filter="url(#shadow13)">
    <rect width="130" height="50" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#d97706">3. OPEN / FIXING</text>
    <text x="65" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Root Cause Analysis</text>
  </g>

  <!-- Exceptional Triage States (Top Row) -->
  <!-- REJECTED -->
  <g transform="translate(340, 230)" filter="url(#shadow13)">
    <rect width="105" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="52" y="20" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">REJECTED</text>
    <text x="52" y="34" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#334155">Not a Defect</text>
  </g>
  <!-- DUPLICATE -->
  <g transform="translate(470, 230)" filter="url(#shadow13)">
    <rect width="110" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="55" y="20" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">DUPLICATE</text>
    <text x="55" y="34" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#334155">Already Tracked</text>
  </g>
  <!-- DEFERRED -->
  <g transform="translate(605, 230)" filter="url(#shadow13)">
    <rect width="110" height="42" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
    <text x="55" y="20" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">DEFERRED</text>
    <text x="55" y="34" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#334155">Postponed</text>
  </g>

  <!-- State 4: FIXED -->
  <g transform="translate(650, 105)" filter="url(#shadow13)">
    <rect width="120" height="50" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#047857">4. FIXED</text>
    <text x="60" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Patch Committed</text>
  </g>

  <!-- State 5: PENDING RETEST / DEPLOYED -->
  <g transform="translate(760, 310)" filter="url(#shadow13)">
    <rect width="140" height="50" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10.5" font-weight="bold" fill="#0284c7">5. PENDING RETEST</text>
    <text x="70" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Build in Staging</text>
  </g>

  <!-- State 6: RE-TESTING -->
  <g transform="translate(560, 310)" filter="url(#shadow13)">
    <rect width="130" height="50" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#4338ca">6. RE-TESTING</text>
    <text x="65" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Validation by QA</text>
  </g>

  <!-- REOPENED STATE -->
  <g transform="translate(360, 310)" filter="url(#shadow13)">
    <rect width="130" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">REOPENED</text>
    <text x="65" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#991b1b">Defect Still Exists</text>
  </g>

  <!-- State 7: VERIFIED -->
  <g transform="translate(560, 420)" filter="url(#shadow13)">
    <rect width="130" height="50" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">7. VERIFIED</text>
    <text x="65" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#334155">Test Case Passed</text>
  </g>

  <!-- State 8: CLOSED (Final Terminal Node) -->
  <g transform="translate(360, 420)" filter="url(#shadow13)">
    <rect width="130" height="50" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <circle cx="20" cy="25" r="8" fill="#059669"/>
    <text x="75" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#020617">8. CLOSED</text>
    <text x="75" y="40" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">Archived &amp; Released</text>
  </g>

  <!-- TRANSITION ARROWS -->
  <!-- Start -> NEW -->
  <line x1="74" y1="130" x2="120" y2="130" stroke="#0284c7" stroke-width="1.5" marker-end="url(#bug-arrow)"/>
  <!-- NEW -> ASSIGNED -->
  <line x1="240" y1="130" x2="290" y2="130" stroke="#0284c7" stroke-width="1.5" marker-end="url(#bug-arrow)"/>
  <!-- ASSIGNED -> OPEN -->
  <line x1="410" y1="130" x2="460" y2="130" stroke="#0284c7" stroke-width="1.5" marker-end="url(#bug-arrow)"/>
  <!-- OPEN -> FIXED -->
  <line x1="590" y1="130" x2="650" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#bug-arrow-green)"/>
  
  <!-- OPEN -> Exceptional states -->
  <path d="M 500 155 L 500 190 L 392 190 L 392 230" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#bug-arrow-red)"/>
  <path d="M 525 155 L 525 230" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#bug-arrow-red)"/>
  <path d="M 550 155 L 550 190 L 660 190 L 660 230" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#bug-arrow)"/>

  <!-- FIXED -> PENDING RETEST -->
  <path d="M 710 155 L 710 200 L 830 200 L 830 310" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#bug-arrow)"/>
  <!-- PENDING RETEST -> RE-TESTING -->
  <line x1="760" y1="335" x2="690" y2="335" stroke="#0284c7" stroke-width="1.5" marker-end="url(#bug-arrow)"/>

  <!-- RE-TESTING -> REOPENED (Failed) -->
  <line x1="560" y1="335" x2="490" y2="335" stroke="#dc2626" stroke-width="1.5" marker-end="url(#bug-arrow-red)"/>
  <text x="525" y="326" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#dc2626">[Failed]</text>

  <!-- REOPENED -> OPEN -->
  <path d="M 425 310 L 425 210 L 485 210 L 485 155" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#bug-arrow-red)"/>

  <!-- RE-TESTING -> VERIFIED (Passed) -->
  <line x1="625" y1="360" x2="625" y2="420" stroke="#059669" stroke-width="1.5" marker-end="url(#bug-arrow-green)"/>
  <text x="645" y="395" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#6ee7b7">[Passed]</text>

  <!-- VERIFIED -> CLOSED -->
  <line x1="560" y1="445" x2="490" y2="445" stroke="#059669" stroke-width="1.5" marker-end="url(#bug-arrow-green)"/>

  <!-- Left info card: Severity Matrix -->
  <g transform="translate(40, 310)">
    <rect width="260" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" filter="url(#shadow13)"/>
    <text x="130" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10.5" font-weight="bold" fill="#0284c7">Severity vs. Priority Matrix</text>
    
    <g transform="translate(15, 38)">
      <rect width="110" height="24" rx="3" fill="#fee2e2" stroke="#dc2626"/>
      <text x="55" y="16" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" font-weight="bold" fill="#991b1b">S1: Critical / Blocker</text>
    </g>
    <g transform="translate(135, 38)">
      <rect width="110" height="24" rx="3" fill="#fee2e2" stroke="#dc2626"/>
      <text x="55" y="16" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" font-weight="bold" fill="#991b1b">P1: Immediate (24h)</text>
    </g>

    <g transform="translate(15, 68)">
      <rect width="110" height="24" rx="3" fill="#451a03" stroke="#ea580c"/>
      <text x="55" y="16" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#d97706">S2: Major Defect</text>
    </g>
    <g transform="translate(135, 68)">
      <rect width="110" height="24" rx="3" fill="#451a03" stroke="#ea580c"/>
      <text x="55" y="16" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#d97706">P2: Next Release</text>
    </g>

    <g transform="translate(15, 98)">
      <rect width="110" height="24" rx="3" fill="#ffffff" stroke="#94a3b8"/>
      <text x="55" y="16" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#334155">S3: Minor / Trivial</text>
    </g>
    <g transform="translate(135, 98)">
      <rect width="110" height="24" rx="3" fill="#ffffff" stroke="#94a3b8"/>
      <text x="55" y="16" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#334155">P3: Low Priority</text>
    </g>
  </g>

</svg>
