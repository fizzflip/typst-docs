<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
    <marker id="cfg-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="cfg-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="cfg-arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="940" height="560" rx="14" fill="url(#bgGrad9)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="28" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">CONTROL FLOW GRAPH (CFG) &amp; CYCLOMATIC COMPLEXITY</text>
  <text x="470" y="46" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10.5" fill="#475569">McCabe's Structural Complexity Analysis: Nodes (N=8), Edges (E=10), Predicates (P=3), Regions (R=4)</text>

  <!-- LEFT: CFG Graph (X: 50 to 460) -->
  <g transform="translate(60, 65)">
    <rect width="400" height="470" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="200" y="24" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">Control Flow Graph (CFG)</text>

    <!-- Region Labels -->
    <rect x="220" y="115" width="42" height="22" rx="4" fill="#f8fafc" stroke="#9333ea" stroke-dasharray="2,2"/>
    <text x="241" y="130" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10" font-weight="bold" fill="#7e22ce">R1</text>

    <rect x="220" y="215" width="42" height="22" rx="4" fill="#f8fafc" stroke="#9333ea" stroke-dasharray="2,2"/>
    <text x="241" y="230" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10" font-weight="bold" fill="#7e22ce">R2</text>

    <rect x="220" y="315" width="42" height="22" rx="4" fill="#f8fafc" stroke="#9333ea" stroke-dasharray="2,2"/>
    <text x="241" y="330" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10" font-weight="bold" fill="#7e22ce">R3</text>

    <rect x="340" y="240" width="42" height="22" rx="4" fill="#f8fafc" stroke="#9333ea" stroke-dasharray="2,2"/>
    <text x="361" y="255" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10" font-weight="bold" fill="#7e22ce">R4</text>

    <!-- Node 1: Entry / Predicate 1 -->
    <circle cx="160" cy="65" r="18" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="70" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">1</text>
    <text x="75" y="70" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#475569">isPremium?</text>

    <!-- Node 2: surgeMultiplier = 0.20 -->
    <circle cx="280" cy="115" r="18" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <text x="280" y="120" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#047857">2</text>
    <text x="305" y="120" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#475569">d = 0.20</text>

    <!-- Node 3: Predicate 2 (total > 1000) -->
    <circle cx="160" cy="165" r="18" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="170" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">3</text>
    <text x="80" y="170" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#475569">total &gt; 1k?</text>

    <!-- Node 4: surgeMultiplier += 0.05 -->
    <circle cx="280" cy="215" r="18" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <text x="280" y="220" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#047857">4</text>
    <text x="305" y="220" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#475569">d += 0.05</text>

    <!-- Node 5: Predicate 3 (hasPromo) -->
    <circle cx="160" cy="265" r="18" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="270" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">5</text>
    <text x="80" y="270" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#475569">hasPromo?</text>

    <!-- Node 6: surgeMultiplier += couponVal -->
    <circle cx="280" cy="315" r="18" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <text x="280" y="320" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#047857">6</text>
    <text x="305" y="320" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#475569">d += cVal</text>

    <!-- Node 7: Confluence / Compute Net Total -->
    <circle cx="160" cy="380" r="18" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
    <text x="160" y="385" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#d97706">7</text>
    <text x="70" y="385" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#475569">calcNetPrice</text>

    <!-- Node 8: Exit Return -->
    <circle cx="160" cy="445" r="16" fill="#ffffff" stroke="#ec4899" stroke-width="2"/>
    <circle cx="160" cy="445" r="10" fill="#ec4899"/>
    <text x="190" y="450" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#db2777">8 (return total)</text>

    <!-- EDGES WITH ARROWS -->
    <!-- 1 -> 2 (True) -->
    <path d="M 175 55 L 270 100" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#cfg-arrow-green)"/>
    <text x="225" y="70" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#047857">T (e1)</text>

    <!-- 1 -> 3 (False) -->
    <line x1="160" y1="83" x2="160" y2="147" stroke="#ea580c" stroke-width="1.5" marker-end="url(#cfg-arrow-amber)"/>
    <text x="142" y="115" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#d97706">F (e2)</text>

    <!-- 2 -> 3 -->
    <path d="M 270 130 L 178 160" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#cfg-arrow)"/>
    <text x="235" y="152" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0284c7">e3</text>

    <!-- 3 -> 4 (True) -->
    <path d="M 175 155 L 270 200" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#cfg-arrow-green)"/>
    <text x="225" y="170" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#047857">T (e4)</text>

    <!-- 3 -> 5 (False) -->
    <line x1="160" y1="183" x2="160" y2="247" stroke="#ea580c" stroke-width="1.5" marker-end="url(#cfg-arrow-amber)"/>
    <text x="142" y="215" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#d97706">F (e5)</text>

    <!-- 4 -> 5 -->
    <path d="M 270 230 L 178 260" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#cfg-arrow)"/>
    <text x="235" y="252" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0284c7">e6</text>

    <!-- 5 -> 6 (True) -->
    <path d="M 175 255 L 270 300" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#cfg-arrow-green)"/>
    <text x="225" y="270" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#047857">T (e7)</text>

    <!-- 5 -> 7 (False) -->
    <line x1="160" y1="283" x2="160" y2="362" stroke="#ea580c" stroke-width="1.5" marker-end="url(#cfg-arrow-amber)"/>
    <text x="142" y="325" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#d97706">F (e8)</text>

    <!-- 6 -> 7 -->
    <path d="M 270 330 L 178 375" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#cfg-arrow)"/>
    <text x="235" y="360" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0284c7">e9</text>

    <!-- 7 -> 8 -->
    <line x1="160" y1="398" x2="160" y2="429" stroke="#0284c7" stroke-width="1.5" marker-end="url(#cfg-arrow)"/>
    <text x="170" y="416" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0284c7">e10</text>
  </g>

  <!-- RIGHT: Mathematical Complexity & Independent Paths (X: 480 to 910) -->
  <g transform="translate(480, 65)">
    <!-- Box 1: McCabe Formulas -->
    <rect width="430" height="225" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow9)"/>
    <text x="18" y="28" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">McCabe's Cyclomatic Complexity Formulations</text>
    
    <text x="18" y="58" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#0f172a">Method 1: Edge - Node Formula</text>
    <text x="35" y="78" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="bold" fill="#047857">V(G) = E - N + 2P</text>
    <text x="35" y="96" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#334155">V(G) = 10 - 8 + 2(1) = <tspan fill="#0284c7" font-weight="bold">4</tspan></text>

    <text x="18" y="126" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#0f172a">Method 2: Predicate Node Formula</text>
    <text x="35" y="146" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="bold" fill="#047857">V(G) = P_nodes + 1</text>
    <text x="35" y="164" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#334155">V(G) = 3 + 1 = <tspan fill="#0284c7" font-weight="bold">4</tspan>  (Predicates: 1, 3, 5)</text>

    <text x="18" y="194" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#0f172a">Method 3: Enclosed Regions Formula</text>
    <text x="35" y="214" font-family="DejaVu Sans Mono, monospace" font-size="10" fill="#334155">V(G) = Count(R1, R2, R3, R4) = <tspan fill="#0284c7" font-weight="bold">4</tspan></text>

    <!-- Box 2: Independent Basis Paths -->
    <g transform="translate(0, 240)">
      <rect width="430" height="230" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5" filter="url(#shadow9)"/>
      <text x="18" y="26" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="bold" fill="#047857">Basis Path Set (Linearly Independent Paths)</text>

      <g transform="translate(18, 42)">
        <rect width="395" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-family="DejaVu Sans Mono, monospace" font-size="9" font-weight="bold" fill="#0284c7">Path 1 (All False Fallthrough):</text>
        <text x="10" y="30" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#334155">1 -> 3 -> 5 -> 7 -> 8</text>
      </g>

      <g transform="translate(18, 86)">
        <rect width="395" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-family="DejaVu Sans Mono, monospace" font-size="9" font-weight="bold" fill="#0284c7">Path 2 (Premium Member):</text>
        <text x="10" y="30" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#334155">1 -> 2 -> 3 -> 5 -> 7 -> 8</text>
      </g>

      <g transform="translate(18, 130)">
        <rect width="395" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-family="DejaVu Sans Mono, monospace" font-size="9" font-weight="bold" fill="#0284c7">Path 3 (High Value RideSession):</text>
        <text x="10" y="30" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#334155">1 -> 3 -> 4 -> 5 -> 7 -> 8</text>
      </g>

      <g transform="translate(18, 174)">
        <rect width="395" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="10" y="16" font-family="DejaVu Sans Mono, monospace" font-size="9" font-weight="bold" fill="#0284c7">Path 4 (Promo Coupon Applied):</text>
        <text x="10" y="30" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#334155">1 -> 3 -> 5 -> 6 -> 7 -> 8</text>
      </g>
    </g>
  </g>

</svg>
