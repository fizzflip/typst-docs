<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
    <marker id="oa-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="oa-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="940" height="540" rx="14" fill="url(#bgGrad11)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="28" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">OAUTH 2.0 / OIDC AUTHENTICATION &amp; VERIFICATION FLOW</text>
  <text x="470" y="46" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10.5" fill="#475569">Authorization Code Grant with PKCE, State Validation, &amp; JWT Verification Checkpoints</text>

  <!-- 4 PARTICIPANTS (Lifelines) -->
  <!-- 1: User Agent / Browser (X: 110) -->
  <g transform="translate(30, 65)">
    <rect width="150" height="34" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <text x="75" y="21" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">User Agent (Browser)</text>
    <line x1="75" y1="34" x2="75" y2="450" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  </g>

  <!-- 2: Client Backend (X: 350) -->
  <g transform="translate(275, 65)">
    <rect width="150" height="34" rx="4" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="75" y="21" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#4338ca">SwiftRide Backend</text>
    <line x1="75" y1="34" x2="75" y2="450" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  </g>

  <!-- 3: Authorization Server (X: 600) -->
  <g transform="translate(525, 65)">
    <rect width="150" height="34" rx="4" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5"/>
    <text x="75" y="21" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#d97706">Auth0 / OAuth Server</text>
    <line x1="75" y1="34" x2="75" y2="450" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  </g>

  <!-- 4: Resource Server (X: 830) -->
  <g transform="translate(755, 65)">
    <rect width="150" height="34" rx="4" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <text x="75" y="21" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#047857">Resource API (User)</text>
    <line x1="75" y1="34" x2="75" y2="450" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  </g>

  <!-- Step 1: User clicks login -> Generates PKCE & state -->
  <line x1="105" y1="120" x2="350" y2="120" stroke="#0284c7" stroke-width="1.5" marker-end="url(#oa-arrow)"/>
  <text x="227" y="112" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#0f172a">1: Click 'Sign in with SSO'</text>

  <!-- Checkpoint 1: PKCE Code Challenge -->
  <rect x="290" y="130" width="120" height="24" rx="4" fill="#ffffff" stroke="#4f46e5"/>
  <text x="350" y="146" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#4338ca">Gen state &amp; code_verifier</text>

  <!-- Step 2: 302 Redirect to /authorize -->
  <line x1="350" y1="170" x2="600" y2="170" stroke="#0284c7" stroke-width="1.5" marker-end="url(#oa-arrow)"/>
  <text x="475" y="162" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#0f172a">2: /authorize?client_id=...&amp;scope=openid&amp;code_challenge=...</text>

  <!-- Step 3: Auth Server Prompts Login / Consent -->
  <line x1="600" y1="200" x2="105" y2="200" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#oa-arrow)"/>
  <text x="352" y="193" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#d97706">3: Render Consent &amp; Credentials Form</text>

  <!-- Step 4: User Authenticates & Returns Auth Code -->
  <line x1="105" y1="230" x2="600" y2="230" stroke="#0284c7" stroke-width="1.5" marker-end="url(#oa-arrow)"/>
  <text x="352" y="223" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#0f172a">4: Submit Credentials &amp; Grant Consent</text>

  <!-- Step 5: 302 Redirect with code & state -->
  <line x1="600" y1="260" x2="350" y2="260" stroke="#059669" stroke-width="1.5" marker-end="url(#oa-arrow-green)"/>
  <text x="475" y="253" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#047857">5: 302 Redirect callback (code='XYZ', state='N12')</text>

  <!-- Checkpoint 2: CSRF Validation -->
  <rect x="270" y="275" width="160" height="24" rx="4" fill="#064e3b" stroke="#059669"/>
  <text x="350" y="291" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" font-weight="bold" fill="#6ee7b7">✓ Validate State Nonce (Anti-CSRF)</text>

  <!-- Step 6: Exchange Code for Tokens via POST /oauth/token -->
  <line x1="350" y1="320" x2="600" y2="320" stroke="#0284c7" stroke-width="1.5" marker-end="url(#oa-arrow)"/>
  <text x="475" y="312" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#0f172a">6: POST /token (code, code_verifier, client_secret)</text>

  <!-- Step 7: Auth Server responds with JWT & Refresh Token -->
  <line x1="600" y1="355" x2="350" y2="355" stroke="#059669" stroke-width="1.5" marker-end="url(#oa-arrow-green)"/>
  <text x="475" y="348" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#047857">7: 200 OK {access_token: JWT, id_token, refresh_token}</text>

  <!-- Step 8: Backend fetches user profile from Resource Server -->
  <line x1="350" y1="390" x2="830" y2="390" stroke="#0284c7" stroke-width="1.5" marker-end="url(#oa-arrow)"/>
  <text x="590" y="382" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#0f172a">8: GET /userinfo (Authorization: Bearer &lt;JWT&gt;)</text>

  <!-- Step 9: User Profile Returned -->
  <line x1="830" y1="420" x2="350" y2="420" stroke="#059669" stroke-width="1.5" marker-end="url(#oa-arrow-green)"/>
  <text x="590" y="413" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#047857">9: 200 OK {sub, email, name, avatar}</text>

  <!-- Step 10: Establish Session & Redirect User -->
  <line x1="350" y1="450" x2="105" y2="450" stroke="#047857" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#oa-arrow-green)"/>
  <text x="227" y="443" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" fill="#047857">10: Set HTTP-Only Cookie &amp; Load Dashboard</text>

  <!-- Verification Badges Footer -->
  <g transform="translate(140, 485)">
    <rect width="660" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" filter="url(#shadow11)"/>
    <text x="30" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#0284c7">Key Verifications:</text>
    <text x="145" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">✓ PKCE SHA-256 Match</text>
    <text x="285" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">✓ State Replay Defense</text>
    <text x="420" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">✓ JWT RS256 Signature</text>
    <text x="560" y="21" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">✓ Token Expiration (exp)</text>
  </g>

</svg>
