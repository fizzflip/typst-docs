<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow12" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="940" height="520" rx="14" fill="url(#bgGrad12)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="28" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">BLISK DUAL-VIEWPORT RESPONSIVE TESTING WORKSPACE</text>
  <text x="470" y="46" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="10.5" fill="#475569">Simultaneous Device Emulation, Real-Time Scroll Synchronization, &amp; Viewport Breakpoint Testing</text>

  <!-- LEFT: Mobile Device Emulation (iPhone / Pixel Frame) -->
  <g transform="translate(50, 75)" filter="url(#shadow12)">
    <!-- Phone Outer Bezel -->
    <rect width="210" height="380" rx="24" fill="#020617" stroke="#94a3b8" stroke-width="3"/>
    <!-- Speaker & Camera Notch -->
    <rect x="75" y="10" width="60" height="12" rx="6" fill="#f8fafc"/>
    <circle cx="120" cy="16" r="3" fill="#0284c7"/>
    
    <!-- Phone Screen Canvas (390 x 844 aspect) -->
    <g transform="translate(12, 30)">
      <rect width="186" height="325" rx="4" fill="#ffffff"/>
      
      <!-- Mobile App Header -->
      <rect width="186" height="32" fill="#f8fafc"/>
      <!-- Burger menu icon -->
      <line x1="12" y1="12" x2="26" y2="12" stroke="#0284c7" stroke-width="2"/>
      <line x1="12" y1="17" x2="26" y2="17" stroke="#0284c7" stroke-width="2"/>
      <line x1="12" y1="22" x2="26" y2="22" stroke="#0284c7" stroke-width="2"/>
      <text x="93" y="21" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">SwiftRide Mobile</text>

      <!-- Search input -->
      <rect x="10" y="40" width="166" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="53" font-family="DejaVu Sans, Inter, sans-serif" font-size="7.5" fill="#475569">🔍 Search vehicles...</text>

      <!-- Single Column Mobile Cards -->
      <g transform="translate(10, 68)">
        <rect width="166" height="65" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <rect x="6" y="8" width="48" height="48" rx="3" fill="#e2e8f0"/>
        <text x="62" y="22" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Wireless Headset</text>
        <text x="62" y="36" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#047857">$129.99</text>
        <rect x="62" y="44" width="70" height="14" rx="3" fill="#0369a1"/>
        <text x="97" y="54" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" font-weight="bold" fill="#020617">Add to RideSession</text>
      </g>

      <g transform="translate(10, 142)">
        <rect width="166" height="65" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="6" y="8" width="48" height="48" rx="3" fill="#e2e8f0"/>
        <text x="62" y="22" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Smart Watch Pro</text>
        <text x="62" y="36" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" fill="#047857">$249.00</text>
        <rect x="62" y="44" width="70" height="14" rx="3" fill="#0369a1"/>
        <text x="97" y="54" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" font-weight="bold" fill="#020617">Add to RideSession</text>
      </g>

      <!-- Viewport Label -->
      <rect x="25" y="295" width="136" height="18" rx="3" fill="#0369a1"/>
      <text x="93" y="307" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8" font-weight="bold" fill="#020617">Viewport: 390 x 844 px</text>
    </g>
  </g>

  <!-- CENTER: Synchronization Engine Hub -->
  <g transform="translate(290, 160)" filter="url(#shadow12)">
    <rect width="180" height="180" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">Blisk Sync Core</text>
    
    <g transform="translate(12, 40)">
      <rect width="156" height="30" rx="4" fill="#ffffff" stroke="#059669"/>
      <text x="78" y="19" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#6ee7b7">⮂ Synchronized Scroll</text>
    </g>

    <g transform="translate(12, 80)">
      <rect width="156" height="30" rx="4" fill="#ffffff" stroke="#ea580c"/>
      <text x="78" y="19" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#d97706">🌐 Synced URL Routing</text>
    </g>

    <g transform="translate(12, 120)">
      <rect width="156" height="30" rx="4" fill="#ffffff" stroke="#4f46e5"/>
      <text x="78" y="19" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#4338ca">⚡ Auto-Reload on Save</text>
    </g>
  </g>

  <!-- Connectors from Engine to Viewports -->
  <line x1="260" y1="250" x2="290" y2="250" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="470" y1="250" x2="500" y2="250" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- RIGHT: Desktop Browser Viewport (X: 500 to 890) -->
  <g transform="translate(500, 75)" filter="url(#shadow12)">
    <rect width="390" height="380" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Browser Titlebar -->
    <rect width="390" height="34" rx="8" fill="#f8fafc"/>
    <circle cx="16" cy="17" r="4" fill="#dc2626"/>
    <circle cx="30" cy="17" r="4" fill="#ea580c"/>
    <circle cx="44" cy="17" r="4" fill="#059669"/>
    
    <!-- URL Bar -->
    <rect x="65" y="8" width="250" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="75" y="20" font-family="DejaVu Sans Mono, monospace" font-size="8" fill="#334155">https://swiftride.local/vehicles</text>

    <!-- Desktop Navigation Bar -->
    <g transform="translate(10, 42)">
      <rect width="370" height="28" fill="#f8fafc" rx="4"/>
      <text x="14" y="18" font-family="DejaVu Sans, Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#0284c7">SwiftRide</text>
      <text x="90" y="18" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0f172a">Home</text>
      <text x="135" y="18" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0f172a">Catalog</text>
      <text x="185" y="18" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0f172a">Rides</text>
      <text x="235" y="18" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#0f172a">Support</text>
      <text x="320" y="18" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" fill="#d97706">🛒 RideSession (2)</text>
    </g>

    <!-- Desktop Multi-Column Layout -->
    <!-- Left Filter Sidebar -->
    <g transform="translate(10, 78)">
      <rect width="90" height="240" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="20" font-family="DejaVu Sans, Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#0284c7">Filters</text>
      <text x="10" y="40" font-family="DejaVu Sans, Inter, sans-serif" font-size="7.5" fill="#334155">☑ Electronics</text>
      <text x="10" y="58" font-family="DejaVu Sans, Inter, sans-serif" font-size="7.5" fill="#334155">☐ Footwear</text>
      <text x="10" y="76" font-family="DejaVu Sans, Inter, sans-serif" font-size="7.5" fill="#334155">☐ Accessories</text>
      <text x="10" y="105" font-family="DejaVu Sans, Inter, sans-serif" font-size="8" font-weight="bold" fill="#0f172a">Price Range</text>
      <rect x="10" y="115" width="70" height="4" rx="2" fill="#0284c7"/>
    </g>

    <!-- Vehicle Grid (3 Column) -->
    <g transform="translate(110, 78)">
      <!-- Card 1 -->
      <rect width="80" height="110" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <rect x="8" y="8" width="64" height="45" rx="3" fill="#e2e8f0"/>
      <text x="8" y="65" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" font-weight="bold" fill="#0f172a">Wireless Headset</text>
      <text x="8" y="77" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" fill="#047857">$129.99</text>
      <rect x="8" y="84" width="64" height="16" rx="2" fill="#0369a1"/>
      <text x="40" y="95" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="6.5" fill="#020617">Add</text>

      <!-- Card 2 -->
      <g transform="translate(90, 0)">
        <rect width="80" height="110" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="64" height="45" rx="3" fill="#e2e8f0"/>
        <text x="8" y="65" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" font-weight="bold" fill="#0f172a">Smart Watch Pro</text>
        <text x="8" y="77" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" fill="#047857">$249.00</text>
        <rect x="8" y="84" width="64" height="16" rx="2" fill="#0369a1"/>
        <text x="40" y="95" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="6.5" fill="#020617">Add</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(180, 0)">
        <rect width="80" height="110" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="64" height="45" rx="3" fill="#e2e8f0"/>
        <text x="8" y="65" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" font-weight="bold" fill="#0f172a">USB-C Hub 7-in-1</text>
        <text x="8" y="77" font-family="DejaVu Sans, Inter, sans-serif" font-size="7" fill="#047857">$49.50</text>
        <rect x="8" y="84" width="64" height="16" rx="2" fill="#0369a1"/>
        <text x="40" y="95" text-anchor="middle" font-family="DejaVu Sans, Inter, sans-serif" font-size="6.5" fill="#020617">Add</text>
      </g>
    </g>

    <!-- Desktop Viewport Tag -->
    <rect x="180" y="340" width="160" height="20" rx="4" fill="#0369a1"/>
    <text x="260" y="354" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" font-weight="bold" fill="#020617">Desktop: 1920 x 1080 px</text>
  </g>

  <!-- Footer Breakpoints -->
  <g transform="translate(120, 470)">
    <text x="0" y="16" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" font-weight="bold" fill="#0284c7">Target RWD Breakpoints:</text>
    <text x="170" y="16" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">xs: &lt;576px (Mobile)</text>
    <text x="320" y="16" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">sm/md: 768px (Tablet)</text>
    <text x="470" y="16" font-family="DejaVu Sans, Inter, sans-serif" font-size="9" fill="#334155">lg/xl: &gt;1200px (Desktop UHD)</text>
  </g>

</svg>
