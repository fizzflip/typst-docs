<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Window Frame -->
  <rect width="800" height="480" rx="6" fill="#f0f0f0" stroke="#999999" stroke-width="1" />

  <!-- Title Bar -->
  <rect x="0" y="0" width="800" height="32" rx="6" fill="#ffffff" />
  <rect x="0" y="26" width="800" height="6" fill="#ffffff" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#d4d4d4" stroke-width="1" />
  <text x="14" y="21" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">PC-A - Command Prompt [Verification]</text>
  
  <!-- Window Controls -->
  <g transform="translate(725, 6)">
    <line x1="4" y1="10" x2="16" y2="10" stroke="#333333" stroke-width="1.2" />
    <rect x="28" y="4" width="12" height="12" fill="none" stroke="#333333" stroke-width="1.2" />
    <line x1="52" y1="4" x2="64" y2="16" stroke="#333333" stroke-width="1.2" />
    <line x1="64" y1="4" x2="52" y2="16" stroke="#333333" stroke-width="1.2" />
  </g>

  <!-- Terminal Body -->
  <rect x="10" y="42" width="780" height="426" fill="#000000" stroke="#555555" stroke-width="1" />

  <g transform="translate(24, 66)" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ffffff">
    <text y="0" fill="#9ca3af">Packet Tracer PC Command Line 1.0</text>
    
    <!-- Tracert -->
    <text y="24">C:\&gt; tracert 192.168.20.2</text>
    <text y="42">Tracing route to 192.168.20.2 over a maximum of 30 hops:</text>
    <text y="62">  1   &lt;1 ms   &lt;1 ms   &lt;1 ms   192.168.10.1   <tspan fill="#60a5fa">[Hop 1: Router R1 G0/0.10]</tspan></text>
    <text y="80">  2   &lt;1 ms   &lt;1 ms   &lt;1 ms   192.168.20.2   <tspan fill="#4ade80">[Hop 2: Target PC-B]</tspan></text>
    <text y="98">Trace complete.</text>
    
    <!-- Ping -->
    <text y="126">C:\&gt; ping 192.168.20.2</text>
    <text y="144">Pinging 192.168.20.2 with 32 bytes of data:</text>
    <text y="164">Reply from 192.168.20.2: bytes=32 time&lt;1ms TTL=127</text>
    <text y="180">Reply from 192.168.20.2: bytes=32 time&lt;1ms TTL=127</text>
    <text y="196">Reply from 192.168.20.2: bytes=32 time&lt;1ms TTL=127</text>
    <text y="212">Reply from 192.168.20.2: bytes=32 time&lt;1ms TTL=127</text>
    
    <text y="238">Ping statistics for 192.168.20.2:</text>
    <text y="254">    Packets: Sent = 4, Received = 4, Lost = 0 <tspan fill="#4ade80" font-weight="bold">(0% loss)</tspan>,</text>
    <text y="270">Approximate round trip times in milli-seconds:</text>
    <text y="286">    Minimum = 0ms, Maximum = 0ms, Average = 0ms</text>
    
    <text y="318">C:\&gt; _</text>
  </g>
</svg>