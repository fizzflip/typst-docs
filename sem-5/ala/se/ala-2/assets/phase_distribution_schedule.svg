<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14" />
      <stop offset="50%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>

    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="rayleighAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" fill="url(#bgGrad3)" rx="12" stroke="#252736" stroke-width="1.2" />

  <!-- Diagram Title Header removed -->
  <g transform="translate(0, -40)">

  <!-- ==================== TOP SECTION: GANTT SCHEDULE BARS ==================== -->
  <g transform="translate(40, 75)">
    <!-- Timeline Axis Header -->
    <rect width="920" height="175" rx="8" fill="#10141e" stroke="#252f48" stroke-width="1" />
    
    <!-- Time scale marks (0, 4, 8, 12, 16, 20.3 Mos) -->
    <!-- Width: 920px -> scale: 920 / 21 = 43.8 px/month -->
    <!-- Origin x=180, available width = 710px for 20.3 months -> 35 px per month -->
    <g transform="translate(180, 24)">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="710" y2="0" stroke="#334155" stroke-width="1" />
      
      <!-- Month 0 -->
      <line x1="0" y1="0" x2="0" y2="135" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
      <text x="0" y="-8" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="9" text-anchor="middle">M0</text>

      <!-- Month 4 -->
      <line x1="140" y1="0" x2="140" y2="135" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
      <text x="140" y="-8" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="9" text-anchor="middle">M4.0</text>

      <!-- Month 8.9 -->
      <line x1="311" y1="0" x2="311" y2="135" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
      <text x="311" y="-8" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="9" text-anchor="middle">M8.9</text>

      <!-- Month 12 -->
      <line x1="420" y1="0" x2="420" y2="135" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
      <text x="420" y="-8" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="9" text-anchor="middle">M12</text>

      <!-- Month 16.2 -->
      <line x1="567" y1="0" x2="567" y2="135" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
      <text x="567" y="-8" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="9" text-anchor="middle">M16.2</text>

      <!-- Month 20.3 (Delivery) -->
      <line x1="710" y1="0" x2="710" y2="135" stroke="#059669" stroke-width="1.5" />
      <text x="710" y="-8" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">M20.3 (Go-Live)</text>
    </g>

    <!-- Phase 1: Requirements Bar -->
    <g transform="translate(16, 38)">
      <text x="0" y="16" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Requirements &amp; Architecture</text>
      <rect x="164" y="2" width="140" height="20" rx="4" fill="url(#p1Grad)" />
      <text x="234" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">4.05 Mos (16% Effort · 63.1 PM)</text>
      <text x="312" y="16" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="9">15.6 Eng</text>
    </g>

    <!-- Phase 2: Detailed Design Bar -->
    <g transform="translate(16, 70)">
      <text x="0" y="16" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Detailed System Design</text>
      <rect x="304" y="2" width="171" height="20" rx="4" fill="url(#p2Grad)" />
      <text x="389" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">4.86 Mos (24% Effort · 94.6 PM)</text>
      <text x="483" y="16" fill="#60a5fa" font-family="'DejaVu Sans Mono', monospace" font-size="9">19.5 Eng</text>
    </g>

    <!-- Phase 3: Coding & Unit Test Bar -->
    <g transform="translate(16, 102)">
      <text x="0" y="16" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Coding &amp; Unit Testing</text>
      <rect x="475" y="2" width="256" height="20" rx="4" fill="url(#p3Grad)" />
      <text x="603" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">7.30 Mos (38% Effort · 149.8 PM)</text>
      <text x="739" y="16" fill="#a78bfa" font-family="'DejaVu Sans Mono', monospace" font-size="9">20.5 Eng</text>
    </g>

    <!-- Phase 4: Integration & Testing Bar -->
    <g transform="translate(16, 134)">
      <text x="0" y="16" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Integration &amp; Verification</text>
      <rect x="731" y="2" width="143" height="20" rx="4" fill="url(#p4Grad)" />
      <text x="802" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">4.05 Mos (22% · 86.7 PM)</text>
      <text x="882" y="16" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="9">21.4 Eng</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SECTION: RAYLEIGH MANPOWER CURVE ==================== -->
  <g transform="translate(40, 275)">
    <rect width="920" height="215" rx="8" fill="#10141e" stroke="#252f48" stroke-width="1" />
    
    <text x="16" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Continuous Staffing Loading Profile (Rayleigh Curve Dynamics)</text>
    <text x="16" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Manpower function: S(t) = 2 · K · a · t · exp(-a · t²) with peak engineering allocation</text>
    
    <rect x="735" y="16" width="165" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="817" y="31" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">PEAK AT MONTH 11.4</text>

    <!-- Y-axis scale (0, 6, 12, 18, 24 Engineers) -->
    <g transform="translate(60, 66)">
      <!-- Y-Axis line -->
      <line x1="0" y1="0" x2="0" y2="125" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="125" x2="820" y2="125" stroke="#334155" stroke-width="1" />

      <!-- Horizontal gridlines -->
      <line x1="0" y1="125" x2="820" y2="125" stroke="#1e293b" stroke-width="1" />
      <text x="-8" y="128" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="end">0</text>

      <line x1="0" y1="94" x2="820" y2="94" stroke="#1a2234" stroke-dasharray="3 3" stroke-width="1" />
      <text x="-8" y="97" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="end">6</text>

      <line x1="0" y1="62" x2="820" y2="62" stroke="#1a2234" stroke-dasharray="3 3" stroke-width="1" />
      <text x="-8" y="65" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="end">12</text>

      <line x1="0" y1="31" x2="820" y2="31" stroke="#1a2234" stroke-dasharray="3 3" stroke-width="1" />
      <text x="-8" y="34" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="end">18</text>

      <line x1="0" y1="0" x2="820" y2="0" stroke="#1a2234" stroke-dasharray="3 3" stroke-width="1" />
      <text x="-8" y="3" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="end">24 Eng</text>

      <!-- Month Ticks along X-axis (820px across 21 months -> ~39px per month) -->
      <!-- M0 (0px), M4 (156px), M8 (312px), M12 (468px), M16 (624px), M20.3 (792px) -->
      <text x="0" y="140" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">M0</text>
      <text x="156" y="140" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">M4</text>
      <text x="312" y="140" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">M8</text>
      <text x="468" y="140" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">M12</text>
      <text x="624" y="140" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">M16</text>
      <text x="792" y="140" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">M20.3</text>

      <!-- Rayleigh Curve Area & Stroke -->
      <!-- Smooth path calculated for Rayleigh with peak around M11-M12 (x~450px, y~125-117 = 8px -> ~22.4 Eng) -->
      <path d="M 0 125 
               C 80 125, 140 82, 220 53 
               C 300 27, 380 9, 450 8 
               C 520 7, 590 19, 660 46 
               C 720 70, 760 97, 792 111 
               L 792 125 Z" 
            fill="url(#rayleighAreaGrad)" />

      <path d="M 0 125 
               C 80 125, 140 82, 220 53 
               C 300 27, 380 9, 450 8 
               C 520 7, 590 19, 660 46 
               C 720 70, 760 97, 792 111" 
            stroke="#38bdf8" stroke-width="2.2" fill="none" />

      <!-- Peak annotation pin -->
      <circle cx="450" cy="8" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <rect x="400" y="-18" width="100" height="18" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
      <text x="450" y="-5" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">PEAK: 22.4 ENG</text>

      <!-- Average Staffing Line (19.4 Eng -> y = 125 - (19.4/24)*125 = 24px) -->
      <line x1="0" y1="24" x2="792" y2="24" stroke="#fbbf24" stroke-dasharray="4 4" stroke-width="1.2" />
      <rect x="680" y="14" width="112" height="16" rx="3" fill="#451a03" stroke="#b45309" stroke-width="0.6" />
      <text x="736" y="26" fill="#fbbf24" font-family="'DejaVu Sans Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">SS = 19.44 Eng (Avg)</text>
    </g>
  </g>
  </g>
</svg>
