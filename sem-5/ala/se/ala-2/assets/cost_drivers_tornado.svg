<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14" />
      <stop offset="50%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="redBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="orangeBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="greenBarGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cyanBarGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glowEAF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" fill="url(#bgGrad4)" rx="12" stroke="#252736" stroke-width="1.2" />

  <!-- Title Header removed -->
  <g transform="translate(0, -40)">

  <!-- ==================== LEFT: TORNADO HORIZONTAL BAR CHART ==================== -->
  <g transform="translate(40, 75)">
    <!-- Container Box -->
    <rect width="530" height="410" rx="8" fill="#0c1018" stroke="#1e293b" stroke-width="1" />

    <!-- Scale Guide Header -->
    <text x="20" y="26" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" font-weight="600">COST DRIVER (RATING)</text>
    <text x="240" y="26" fill="#34d399" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">SAVINGS (&lt; 1.0)</text>
    <text x="320" y="26" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">NOMINAL</text>
    <text x="430" y="26" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">PENALTIES (&gt; 1.0)</text>

    <!-- Nominal Baseline (EM = 1.00 at x = 320) -->
    <line x1="320" y1="36" x2="320" y2="375" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 3" />

    <!-- Gridlines at 0.85 (x=260), 0.90 (x=280), 1.10 (x=360), 1.20 (x=400), 1.40 (x=480) -->
    <!-- 1.40 Line (x = 320 + 40*4 = 480) -->
    <line x1="480" y1="36" x2="480" y2="375" stroke="#1e293b" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="480" y="390" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8" text-anchor="middle">1.40</text>

    <!-- 1.20 Line (x = 400) -->
    <line x1="400" y1="36" x2="400" y2="375" stroke="#1e293b" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="400" y="390" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8" text-anchor="middle">1.20</text>

    <!-- 1.00 Nominal Line (x = 320) -->
    <text x="320" y="390" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">1.00</text>

    <!-- 0.85 Line (x = 260) -->
    <line x1="260" y1="36" x2="260" y2="375" stroke="#1e293b" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="260" y="390" fill="#64748b" font-family="'DejaVu Sans Mono', monospace" font-size="8" text-anchor="middle">0.85</text>

    <!-- ==================== TORNADO BARS ==================== -->
    <!-- 1. RELY: Very High (1.40, +40%) -->
    <g transform="translate(0, 48)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">RELY</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(V.High)</text>
      <rect x="320" y="2" width="160" height="17" rx="3" fill="url(#redBarGrad)" />
      <text x="482" y="14" fill="#f43f5e" font-family="'DejaVu Sans Mono', monospace" font-size="8" font-weight="700">+40% (1.40)</text>
    </g>

    <!-- 2. CPLX: High (1.15, +15%) -->
    <g transform="translate(0, 78)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">CPLX</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="320" y="2" width="60" height="17" rx="3" fill="url(#orangeBarGrad)" />
      <text x="386" y="14" fill="#fb923c" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700">+15% (1.15)</text>
    </g>

    <!-- 3. TIME: High (1.11, +11%) -->
    <g transform="translate(0, 108)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">TIME</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="320" y="2" width="44" height="17" rx="3" fill="url(#orangeBarGrad)" />
      <text x="370" y="14" fill="#fb923c" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700">+11% (1.11)</text>
    </g>

    <!-- 4. DATA: High (1.08, +8%) -->
    <g transform="translate(0, 138)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">DATA</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="320" y="2" width="32" height="17" rx="3" fill="#ca8a04" />
      <text x="358" y="14" fill="#facc15" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700">+8% (1.08)</text>
    </g>

    <!-- 5. NEUTRAL (7 Drivers = 1.00) -->
    <g transform="translate(0, 168)">
      <text x="20" y="14" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5">7 Drivers</text>
      <text x="85" y="14" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">(STOR, VIRT, TURN, AEXP, VEXP, LEXP, SCED)</text>
      <circle cx="320" cy="10" r="3.5" fill="#64748b" />
      <text x="330" y="14" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5">1.00 (Nominal)</text>
    </g>

    <!-- 6. TOOL: High (0.91, -9%) -->
    <g transform="translate(0, 198)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">TOOL</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="284" y="2" width="36" height="17" rx="3" fill="url(#cyanBarGrad)" />
      <text x="278" y="14" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="end">-9% (0.91)</text>
    </g>

    <!-- 7. MODP: High (0.91, -9%) -->
    <g transform="translate(0, 228)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">MODP</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="284" y="2" width="36" height="17" rx="3" fill="url(#cyanBarGrad)" />
      <text x="278" y="14" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="end">-9% (0.91)</text>
    </g>

    <!-- 8. PCAP: High (0.86, -14%) -->
    <g transform="translate(0, 258)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">PCAP</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="264" y="2" width="56" height="17" rx="3" fill="url(#greenBarGrad)" />
      <text x="258" y="14" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="end">-14% (0.86)</text>
    </g>

    <!-- 9. ACAP: High (0.86, -14%) -->
    <g transform="translate(0, 288)">
      <text x="20" y="14" fill="#f1f5f9" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700">ACAP</text>
      <text x="60" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">(High)</text>
      <rect x="264" y="2" width="56" height="17" rx="3" fill="url(#greenBarGrad)" />
      <text x="258" y="14" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" text-anchor="end">-14% (0.86)</text>
    </g>

    <!-- Tornado Summary Bracket Box -->
    <rect x="14" y="322" width="502" height="42" rx="4" fill="#111827" stroke="#374151" stroke-width="0.8" />
    <text x="26" y="340" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Combined Product Multiplier (RELY·DATA·CPLX·TIME):</text>
    <text x="495" y="340" fill="#f43f5e" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700" text-anchor="end">1.929 (+92.9%)</text>

    <text x="26" y="356" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Combined Personnel &amp; Tools Offset (ACAP·PCAP·MODP·TOOL):</text>
    <text x="495" y="356" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="9" font-weight="700" text-anchor="end">0.533 (-46.7%)</text>
  </g>

  <!-- ==================== RIGHT: MATHEMATICAL SYNTHESIS ==================== -->
  <g transform="translate(595, 75)">
    <!-- Box 1: EAF Product Formula -->
    <rect width="365" height="165" rx="8" fill="url(#cardGrad4)" stroke="#6366f1" stroke-width="1.2" />
    
    <rect x="16" y="14" width="145" height="20" rx="3" fill="#312e81" />
    <text x="88" y="28" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MATHEMATICAL SYNTHESIS</text>

    <text x="16" y="54" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Effort Adjustment Factor (EAF)</text>
    <text x="16" y="74" fill="#818cf8" font-family="'DejaVu Sans Mono', monospace" font-size="10">EAF = ∏ (EM<tspan baseline-shift="sub" font-size="75%">i</tspan>) for i = 1 to 15</text>
    
    <line x1="16" y1="84" x2="349" y2="84" stroke="#3730a3" stroke-width="0.8" />

    <text x="16" y="102" fill="#cbd5e1" font-family="'DejaVu Sans Mono', monospace" font-size="9">EAF = (1.40 × 1.08 × 1.15 × 1.11)</text>
    <text x="16" y="118" fill="#cbd5e1" font-family="'DejaVu Sans Mono', monospace" font-size="9">    × (0.86 × 0.86 × 0.91 × 0.91)</text>
    
    <rect x="16" y="128" width="333" height="26" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <text x="182" y="145" fill="#a78bfa" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">EAF = 1.028 (+2.8% Adjustment)</text>

    <!-- Box 2: Strategic Engineering Implication -->
    <g transform="translate(0, 180)">
      <rect width="365" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      
      <text x="16" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Engineering Takeaway &amp; Cost Offsets</text>
      
      <text x="16" y="48" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">Human Capital Neutralization Principle:</text>
      <text x="16" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">• Critical reliability requirements (+40% RELY) and</text>
      <text x="16" y="80" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">  distributed cryptography (+15% CPLX) would inflate</text>
      <text x="16" y="94" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">  engineering effort to 739 PM under average staffing.</text>

      <text x="16" y="118" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">The Compensating Role of Modern Practices:</text>
      <text x="16" y="136" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">• By staffing senior fintech engineers (ACAP/PCAP: -14%)</text>
      <text x="16" y="150" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">  and enforcing modern CI/CD &amp; TDD (TOOL/MODP: -9%),</text>
      <text x="16" y="164" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">  the net penalty is curtailed to just +2.8%.</text>

      <!-- Calibrated Metrics summary card -->
      <rect x="16" y="178" width="333" height="38" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
      <text x="24" y="194" fill="#7dd3fc" font-family="'DejaVu Sans Mono', monospace" font-size="8.5">Calibrated Effort: E<tspan baseline-shift="sub" font-size="75%">adj</tspan> = 394.11 PM</text>
      <text x="24" y="208" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700">T<tspan baseline-shift="sub" font-size="75%">dev</tspan> = 20.27 Months  |  Staffing = 19.44 Engineers</text>
    </g>
  </g>
  </g>
</svg>
