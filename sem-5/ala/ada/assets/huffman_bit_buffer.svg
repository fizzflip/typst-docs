<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 135" width="100%" height="100%">
  <defs>
    <marker id="arrBuf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>

  <style>
    .buf-title { font-family: 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .buf-sub { font-family: 'DejaVu Sans Mono', monospace; font-size: 9px; fill: #9ca3af; text-anchor: middle; }
    .yesno { font-family: 'DejaVu Sans', sans-serif; font-size: 10px; font-weight: bold; fill: #34d399; }
  </style>

  <!-- Step 1 -->
  <rect x="15" y="25" width="125" height="75" rx="6" fill="#1e1b2e" stroke="#6366f1" stroke-width="1.2"/>
  <text x="77" y="55" class="buf-title">1. New Code</text>
  <text x="77" y="73" class="buf-sub">(code, length)</text>

  <line x1="140" y1="62" x2="165" y2="62" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arrBuf)"/>

  <!-- Step 2 -->
  <rect x="170" y="25" width="145" height="75" rx="6" fill="#2b2b36" stroke="#4b5563" stroke-width="1"/>
  <text x="242" y="52" class="buf-title">2. Shift &amp; Append</text>
  <text x="242" y="70" class="buf-sub">buf = (buf &lt;&lt; len) | code</text>
  <text x="242" y="85" class="buf-sub">cnt += len</text>

  <line x1="315" y1="62" x2="340" y2="62" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arrBuf)"/>

  <!-- Step 3: Decision Diamond -->
  <polygon points="410,20 475,62 410,105 345,62" fill="#1e1b2e" stroke="#6366f1" stroke-width="1.4"/>
  <text x="410" y="58" class="buf-title">3. cnt &gt;= 8?</text>
  <text x="410" y="72" class="buf-sub">Check bits</text>

  <!-- Yes -> Step 4 -->
  <line x1="475" y1="62" x2="515" y2="62" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrBuf)"/>
  <text x="480" y="54" class="yesno">Yes</text>

  <!-- Step 4 -->
  <rect x="520" y="25" width="125" height="75" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="582" y="52" class="buf-title" style="fill: #a7f3d0;">4. Flush Byte</text>
  <text x="582" y="70" class="buf-sub" style="fill: #d1fae5;">out = (buf &gt;&gt; cnt-8)</text>
  <text x="582" y="85" class="buf-sub" style="fill: #d1fae5;">file.write(out)</text>

  <line x1="645" y1="62" x2="670" y2="62" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrBuf)"/>

  <!-- Step 5 -->
  <rect x="675" y="25" width="110" height="75" rx="6" fill="#2b2b36" stroke="#4b5563" stroke-width="1"/>
  <text x="730" y="55" class="buf-title">5. Retain</text>
  <text x="730" y="73" class="buf-sub">cnt -= 8</text>
</svg>