<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%">
  <style>
    .eof-title { font-family: 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: bold; fill: #ffffff; }
    .bit-box-txt { font-family: 'DejaVu Sans Mono', monospace; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .bit-box-sub { font-family: 'DejaVu Sans', sans-serif; font-size: 9.5px; fill: #9ca3af; text-anchor: middle; }
  </style>

  <rect x="15" y="15" width="770" height="100" rx="8" fill="#1e1b2e" stroke="#6366f1" stroke-width="1.2"/>
  <text x="30" y="36" class="eof-title" style="fill: #a5b4fc;">Final Byte Alignment &amp; End-Of-File (EOF) Padding Mechanism</text>

  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="360" height="50" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
    <text x="180" y="24" class="bit-box-txt" style="fill: #a7f3d0;">Payload Bits: 1 0 1 1 0 (5 Bits)</text>
    <text x="180" y="40" class="bit-box-sub" style="fill: #6ee7b7;">Actual encoded data stream</text>

    <rect x="370" y="0" width="170" height="50" rx="5" fill="#3b1d1d" stroke="#ef4444" stroke-width="1.2"/>
    <text x="455" y="24" class="bit-box-txt" style="fill: #fca5a5;">Padding: 0 0 0 (3b)</text>
    <text x="455" y="40" class="bit-box-sub" style="fill: #fca5a5;">Unused byte filler</text>

    <rect x="550" y="0" width="180" height="50" rx="5" fill="#2b2b36" stroke="#818cf8" stroke-width="1.4"/>
    <text x="640" y="24" class="bit-box-txt" style="fill: #e0e7ff;">0xB0 (10110000)</text>
    <text x="640" y="40" class="bit-box-sub" style="fill: #c7d2fe;">Final byte written to disk</text>
  </g>
</svg>