<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="100%" height="100%">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23232c"/>
      <stop offset="100%" stop-color="#18181f"/>
    </linearGradient>
    <marker id="arrH" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>

  <style>
    .step-title { font-family: 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: bold; fill: #818cf8; }
    .heap-content { font-family: 'DejaVu Sans Mono', monospace; font-size: 11.5px; fill: #ffffff; }
    .highlight-merge { font-family: 'DejaVu Sans', sans-serif; font-size: 10px; font-weight: bold; fill: #34d399; }
    .final-badge { font-family: 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: bold; fill: #a7f3d0; }
  </style>

  <!-- Step 0 -->
  <rect x="20" y="10" width="760" height="46" rx="6" fill="#1b1b1f" stroke="#4b5563" stroke-width="1"/>
  <text x="35" y="28" class="step-title">Initial Priority Queue (6 Leaves):</text>
  <text x="35" y="44" class="heap-content">[ (F: 5),  (E: 9),  (C: 12),  (B: 13),  (D: 16),  (A: 45) ]</text>
  <text x="610" y="34" class="highlight-merge">Pop: F(5) &amp; E(9)</text>

  <!-- Step 1 -->
  <rect x="20" y="64" width="760" height="46" rx="6" fill="url(#stepBg)" stroke="#6366f1" stroke-width="1.2"/>
  <text x="35" y="82" class="step-title">Step 1 — Merged (F:5 + E:9 = z1:14):</text>
  <text x="35" y="98" class="heap-content">[ (C: 12),  (B: 13),  <tspan fill="#34d399">(z1: 14)</tspan>,  (D: 16),  (A: 45) ]</text>
  <text x="610" y="88" class="highlight-merge">Pop: C(12) &amp; B(13)</text>

  <!-- Step 2 -->
  <rect x="20" y="118" width="760" height="46" rx="6" fill="url(#stepBg)" stroke="#6366f1" stroke-width="1.2"/>
  <text x="35" y="136" class="step-title">Step 2 — Merged (C:12 + B:13 = z2:25):</text>
  <text x="35" y="152" class="heap-content">[ (z1: 14),  (D: 16),  <tspan fill="#34d399">(z2: 25)</tspan>,  (A: 45) ]</text>
  <text x="610" y="142" class="highlight-merge">Pop: z1(14) &amp; D(16)</text>

  <!-- Step 3 -->
  <rect x="20" y="172" width="760" height="46" rx="6" fill="url(#stepBg)" stroke="#6366f1" stroke-width="1.2"/>
  <text x="35" y="190" class="step-title">Step 3 — Merged (z1:14 + D:16 = z3:30):</text>
  <text x="35" y="206" class="heap-content">[ (z2: 25),  <tspan fill="#34d399">(z3: 30)</tspan>,  (A: 45) ]</text>
  <text x="610" y="196" class="highlight-merge">Pop: z2(25) &amp; z3(30)</text>

  <!-- Step 4 -->
  <rect x="20" y="226" width="760" height="46" rx="6" fill="url(#stepBg)" stroke="#6366f1" stroke-width="1.2"/>
  <text x="35" y="244" class="step-title">Step 4 — Merged (z2:25 + z3:30 = z4:55):</text>
  <text x="35" y="260" class="heap-content">[ (A: 45),  <tspan fill="#34d399">(z4: 55)</tspan> ]</text>
  <text x="610" y="250" class="highlight-merge">Pop: A(45) &amp; z4(55)</text>

  <!-- Step 5 (Final Root) -->
  <rect x="20" y="280" width="760" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
  <text x="35" y="306" class="final-badge">Step 5 (Final Complete Tree Root):  [ (Root: 100) ]  — Total Frequency = 100% of File</text>
</svg>