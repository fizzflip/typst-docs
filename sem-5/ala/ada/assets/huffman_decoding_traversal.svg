     style="font-size:10px;font-family:'DejaVu Sans';fill:#9ca3af"
     id="text15">Because Huffman is a prefix code, no codeword is a prefix of another. As soon as any leaf is reached, the symbol is unique</text>
  <text
     x="45.638481"
     y="169.10359"
     style="font-size:10px;font-family:'DejaVu Sans';fill:#9ca3af"
